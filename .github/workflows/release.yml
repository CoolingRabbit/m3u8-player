name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive
        run: python3 build-release.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "m3u8-player ${{ github.ref_name }}"
          body: |
            本地 M3U8/HLS 直播播放器 v1.2.1，本次发布包含 v1.1.3 之后的全部更新。

            ## 更新日志

            ### 全局日志
            - 新增网络、视频流、操作三类日志，支持分类筛选与自动滚动。
            - 日志面板位于固定高度频道列表下方，覆盖清单、分片、质量切换、错误和重连事件。
            - 缓冲时记录缓存余量、媒体就绪状态、最近分片速度、实测吞吐量和近期网络错误。
            - 使用 IndexedDB 保存并在刷新后恢复当日日志。
            - 授权本地目录后，按 `m3u8-player-YYYY-MM-DD.txt` 每日追加日志；也可手动下载当日 TXT。
            - 请求地址不记录 URL 查询参数，降低播放令牌泄露风险。

            ### 播放与界面
            - 播放区在桌面、窄屏和移动端始终固定为 16:9。
            - 全屏时显示视口内最大的 16:9 播放区，多余空间以黑边居中。
            - 修正“智能播放”说明，明确其使用直播窗口、分片时长与上一轮卡顿设置参数。

            ## 使用说明
            下载并解压 `m3u8-player-v1.2.1.zip`，使用最新版 Edge 或 Chrome 打开 `index.html`。首次播放默认静音。日志默认保存在浏览器中；如需每日 TXT 文件，请在日志面板选择保存目录并授权。

            自动重新拉流任务需要保持页面打开。Safari 原生 HLS 路径不提供分片级网络日志。
          files: dist/m3u8-player-v*.zip
          draft: false
          prerelease: false
